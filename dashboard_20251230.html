<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股票分析仪表盘</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-primary: #0f0f23;
            --bg-secondary: #1a1a2e;
            --bg-card: #16213e;
            --accent-primary: #00d4ff;
            --accent-secondary: #7b2cbf;
            --accent-success: #00ff88;
            --accent-warning: #ffd93d;
            --accent-danger: #ff6b6b;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --border-color: #2a2a4a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }

        /* Header */
        header {
            background: linear-gradient(135deg, var(--bg-secondary), var(--bg-card));
            border-bottom: 1px solid var(--border-color);
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        header h1 {
            font-size: 1.8rem;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        header p { color: var(--text-secondary); }

        /* Tab Navigation */
        .tab-nav {
            display: flex;
            gap: 10px;
            background: var(--bg-secondary);
            padding: 5px;
            border-radius: 12px;
        }

        .tab-btn {
            padding: 12px 30px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn:hover {
            color: var(--text-primary);
            background: rgba(255,255,255,0.05);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
        }

        .tab-btn .flag { font-size: 1.2rem; }

        /* Tab Content */
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.4s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Cards */
        .card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .card-header h3 { font-size: 1.1rem; color: var(--text-secondary); }
        .card-header .icon { font-size: 1.5rem; }

        /* Recommendation Banner */
        .recommendation-banner {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(123, 44, 191, 0.1));
            border: 1px solid var(--accent-primary);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .recommendation-info h2 { font-size: 1.3rem; color: var(--accent-primary); }
        .recommendation-info .stock-symbol {
            font-size: 2rem;
            font-weight: bold;
            margin: 8px 0;
        }

        .recommendation-score { text-align: center; }
        .score-value {
            font-size: 3rem;
            font-weight: bold;
            background: linear-gradient(135deg, var(--accent-success), var(--accent-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .score-label { color: var(--text-secondary); font-size: 0.9rem; }

        /* Indicators */
        .indicators { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; }
        .pill {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
        }
        .pill.success { background: rgba(0, 255, 136, 0.15); border-color: var(--accent-success); color: var(--accent-success); }
        .pill.danger { background: rgba(255, 107, 107, 0.15); border-color: var(--accent-danger); color: var(--accent-danger); }
        .pill.warning { background: rgba(255, 217, 61, 0.15); border-color: var(--accent-warning); color: var(--accent-warning); }

        /* Signal List */
        .signals-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .signal-card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid var(--border-color);
        }
        .signal-card h4 { margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .signal-card h4.buy { color: var(--accent-success); }
        .signal-card h4.sell { color: var(--accent-danger); }

        .signal-item {
            padding: 10px;
            margin: 8px 0;
            background: var(--bg-secondary);
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .signal-item .name { font-weight: 600; }
        .signal-item .reason { color: var(--text-secondary); font-size: 0.85rem; flex: 1; margin: 0 15px; }
        .signal-item .score {
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.85rem;
        }
        .signal-item.buy .score { background: rgba(0, 255, 136, 0.2); color: var(--accent-success); }
        .signal-item.sell .score { background: rgba(255, 107, 107, 0.2); color: var(--accent-danger); }
        .no-signal { color: var(--text-secondary); padding: 10px; }

        /* Charts Grid */
        .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .chart-container { height: 280px; }

        /* Ranking Table */
        .ranking-table {
            width: 100%;
            border-collapse: collapse;
        }
        .ranking-table th, .ranking-table td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        .ranking-table th { color: var(--text-secondary); font-weight: 500; font-size: 0.85rem; }
        .ranking-table tr:hover { background: rgba(255,255,255,0.02); }
        .ranking-table .rank { font-weight: bold; }
        .ranking-table .rank-1 { color: #ffd700; }
        .ranking-table .rank-2 { color: #c0c0c0; }
        .ranking-table .rank-3 { color: #cd7f32; }
        .ranking-table .symbol { font-weight: 600; }
        .ranking-table .positive { color: var(--accent-success); }
        .ranking-table .negative { color: var(--accent-danger); }
        .ranking-table .score { font-weight: bold; color: var(--accent-primary); }

        /* Reasons Content */
        .reasons-content { line-height: 1.8; }
        .reasons-content h4 { margin-bottom: 15px; }

        /* Responsive */
        @media (max-width: 768px) {
            .charts-grid { grid-template-columns: 1fr; }
            .tab-btn { padding: 10px 20px; font-size: 0.9rem; }
            header { flex-direction: column; text-align: center; }
        }
    </style>
</head>

        // Charts storage
        const charts = {};

        // Tab switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('tab-' + btn.dataset.market).classList.add('active');
            });
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('update-time').textContent = '更新: ' + new Date().toLocaleString('zh-CN');
            renderMarket('us', marketData.us);
            renderMarket('cn', marketData.cn);
        });

        function renderMarket(market, data) {
            if (!data || data.length === 0) {
                document.getElementById(market + '-top-symbol').textContent = '无数据';
                return;
            }

            const top = data[0];
            const prefix = market + '-';

            // Top recommendation
            document.getElementById(prefix + 'top-symbol').textContent = top.name || top.symbol;
            document.getElementById(prefix + 'top-score').textContent = top.total_score.toFixed(1);

            // Indicators
            const indicators = document.getElementById(prefix + 'top-indicators');
            indicators.innerHTML = '';
            
            let rsiClass = 'pill' + (top.RSI < 30 ? ' success' : (top.RSI > 70 ? ' danger' : ''));
            indicators.innerHTML += `<span class="${rsiClass}">RSI: ${top.RSI.toFixed(1)}</span>`;
            
            let macdClass = top.MACD > 0 ? 'pill success' : 'pill danger';
            indicators.innerHTML += `<span class="${macdClass}">MACD: ${top.MACD > 0 ? '金叉' : '死叉'}</span>`;
            
            // Trend pill
            let trendClass = 'pill';
            if (top.Trend_score >= 75) trendClass += ' success';
            else if (top.Trend_score < 25) trendClass += ' danger';
            indicators.innerHTML += `<span class="${trendClass}">趋势: ${top.Trend_score.toFixed(0)}分</span>`;
            
            // Momentum pill
            let momClass = top.MomentumRate >= 0 ? 'pill success' : 'pill danger';
            let momSign = top.MomentumRate >= 0 ? '+' : '';
            indicators.innerHTML += `<span class="${momClass}">动量: ${momSign}${top.MomentumRate.toFixed(1)}%</span>`;
            
            let volStr = top.VolumeRatio > 1.5 ? '放量' : (top.VolumeRatio < 0.7 ? '缩量' : '量比');
            let volClass = top.VolumeRatio > 1.5 ? 'pill success' : (top.VolumeRatio < 0.7 ? 'pill warning' : 'pill');
            indicators.innerHTML += `<span class="${volClass}">${volStr} ${top.VolumeRatio.toFixed(1)}x</span>`;

            // Signals
            renderSignals(market, data);
            
            // Charts
            renderScoreChart(market, data);
            renderBreakdownChart(market, top);
            renderRsiChart(market, data);
            renderMomentumChart(market, data);
            
            // Table
            renderTable(market, data);
            
            // Reasons
            renderReasons(market, top);
        }

        function renderSignals(market, data) {
            const prefix = market + '-';
            const buyContainer = document.getElementById(prefix + 'buy-candidates');
            const sellContainer = document.getElementById(prefix + 'sell-candidates');
            
            const buyers = data.filter(d => d.signal === 'BUY');
            const sellers = data.filter(d => d.signal === 'SELL');

            buyContainer.innerHTML = buyers.length > 0 ? buyers.slice(0, 4).map(s => `
                <div class="signal-item buy">
                    <span class="name">${s.name || s.symbol}</span>
                    <span class="reason">${s.signal_reason || ''}</span>
                    <span class="score">${s.total_score.toFixed(1)}分</span>
                </div>
            `).join('') : '<div class="no-signal">无明确买入信号</div>';

            sellContainer.innerHTML = sellers.length > 0 ? sellers.slice(0, 4).map(s => `
                <div class="signal-item sell">
                    <span class="name">${s.name || s.symbol}</span>
                    <span class="reason">${s.signal_reason || ''}</span>
                    <span class="score">${s.total_score.toFixed(1)}分</span>
                </div>
            `).join('') : '<div class="no-signal">无明确卖出信号</div>';
        }

        function renderScoreChart(market, data) {
            const ctx = document.getElementById(market + '-score-chart').getContext('2d');
            if (charts[market + '-score']) charts[market + '-score'].destroy();
            
            charts[market + '-score'] = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.map(d => d.name || d.symbol),
                    datasets: [{
                        label: '综合得分',
                        data: data.map(d => d.total_score),
                        backgroundColor: data.map((d, i) => i === 0 ? 'rgba(0, 212, 255, 0.8)' : 'rgba(123, 44, 191, 0.6)'),
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, max: 100, grid: { color: 'rgba(255,255,255,0.1)' }, ticks: { color: '#a0a0b0' } },
                        x: { grid: { display: false }, ticks: { color: '#a0a0b0' } }
                    }
                }
            });
        }

        function renderBreakdownChart(market, top) {
            const ctx = document.getElementById(market + '-breakdown-chart').getContext('2d');
            if (charts[market + '-breakdown']) charts[market + '-breakdown'].destroy();
            
            charts[market + '-breakdown'] = new Chart(ctx, {

        function renderTable(market, data) {
            const tbody = document.getElementById(market + '-ranking-tbody');

                const macdStr = d.MACD > 0 ? '金叉' : '死叉';
                const momStr = (d.MomentumRate >= 0 ? '+' : '') + d.MomentumRate.toFixed(1) + '%';
                let volStr = d.VolumeRatio.toFixed(1) + 'x';
                let volClass = d.VolumeRatio > 1.5 ? 'positive' : (d.VolumeRatio < 0.7 ? 'negative' : '');

                return `<tr>
                    <td class="rank ${rankClass}">#${i+1}</td>
                    <td class="symbol">${d.name || d.symbol}</td>
                    <td>$${d.close.toFixed(2)}</td>
                    <td class="${changeClass}">${changeStr}</td>
                    <td>${d.RSI.toFixed(1)}</td>
                    <td>${macdStr}</td>
                    <td>${d.Trend_score.toFixed(0)}</td>
                    <td class="${d.MomentumRate >= 0 ? 'positive' : 'negative'}">${momStr}</td>
                    <td class="${volClass}">${volStr}</td>
                    <td class="score">${d.total_score.toFixed(1)}</td>
                </tr>`;
            }).join('');
        }

        function renderRsiChart(market, data) {
            const ctx = document.getElementById(market + '-rsi-chart').getContext('2d');
            if (charts[market + '-rsi']) charts[market + '-rsi'].destroy();
            
            const colors = data.map(d => {
                if (d.RSI < 30) return 'rgba(0, 255, 136, 0.8)';
                if (d.RSI > 70) return 'rgba(255, 107, 107, 0.8)';
                return 'rgba(255, 217, 61, 0.8)';
            });
            
            charts[market + '-rsi'] = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.map(d => d.name || d.symbol),
                    datasets: [{
                        label: 'RSI',
                        data: data.map(d => d.RSI),
                        backgroundColor: colors,
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { 
                        legend: { display: false },
                        annotation: {
                            annotations: {
                                line30: { type: 'line', yMin: 30, yMax: 30, borderColor: 'rgba(0, 255, 136, 0.5)', borderDash: [5, 5] },
                                line70: { type: 'line', yMin: 70, yMax: 70, borderColor: 'rgba(255, 107, 107, 0.5)', borderDash: [5, 5] }
                            }
                        }
                    },
                    scales: {
                        y: { beginAtZero: true, max: 100, grid: { color: 'rgba(255,255,255,0.1)' }, ticks: { color: '#a0a0b0' } },
                        x: { grid: { display: false }, ticks: { color: '#a0a0b0' } }
                    }
                }
            });
        }

        function renderMomentumChart(market, data) {
            const ctx = document.getElementById(market + '-momentum-chart').getContext('2d');
            if (charts[market + '-momentum']) charts[market + '-momentum'].destroy();
            
            const colors = data.map(d => d.MomentumRate >= 0 ? 'rgba(0, 255, 136, 0.8)' : 'rgba(255, 107, 107, 0.8)');
            
            charts[market + '-momentum'] = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.map(d => d.name || d.symbol),
                    datasets: [{
                        label: '10日动量',
                        data: data.map(d => d.MomentumRate),
                        backgroundColor: colors,
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { grid: { color: 'rgba(255,255,255,0.1)' }, ticks: { color: '#a0a0b0', callback: v => v + '%' } },
                        x: { grid: { display: false }, ticks: { color: '#a0a0b0' } }
                    }
                }
            });
        }

        function renderReasons(market, top) {
            const container = document.getElementById(market + '-reasons');
            const name = top.name || top.symbol;
            
            let rsiText = '', macdText = '', trendText = '', momText = '', volText = '', summary = '';
            
            // RSI analysis
            if (top.RSI < 30) rsiText = `RSI=${top.RSI.toFixed(1)} 处于<strong>超卖区(&lt;30)</strong>，股价可能被低估`;
            else if (top.RSI < 50) rsiText = `RSI=${top.RSI.toFixed(1)} 处于<strong>偏低区(30-50)</strong>，存在上涨空间`;
            else if (top.RSI < 70) rsiText = `RSI=${top.RSI.toFixed(1)} 处于<strong>正常区间(50-70)</strong>，趋势健康`;
            else rsiText = `RSI=${top.RSI.toFixed(1)} 处于<strong>超买区(&gt;70)</strong>，注意回调风险`;
            
            // MACD analysis
            if (top.MACD > 0) macdText = `MACD柱状图为正，<strong>多头占优</strong>`;
            else macdText = `MACD柱状图为负，<strong>空头占优</strong>`;
            
            // Trend analysis
            if (top.Trend_score >= 75) trendText = `均线多头排列，<strong>强势上涨趋势</strong>`;
            else if (top.Trend_score >= 50) trendText = `均线走势偏多，<strong>温和上涨</strong>`;
            else if (top.Trend_score >= 25) trendText = `均线走势偏弱，<strong>震荡整理</strong>`;
            else trendText = `均线空头排列，<strong>弱势下跌</strong>`;
            
            // Momentum analysis
            if (top.MomentumRate > 5) momText = `10日动量+${top.MomentumRate.toFixed(1)}%，<strong>强劲上涨动能</strong>`;
            else if (top.MomentumRate > 0) momText = `10日动量+${top.MomentumRate.toFixed(1)}%，<strong>温和上涨</strong>`;
            else if (top.MomentumRate > -5) momText = `10日动量${top.MomentumRate.toFixed(1)}%，<strong>温和回调</strong>`;
            else momText = `10日动量${top.MomentumRate.toFixed(1)}%，<strong>下跌动能强</strong>`;
            
            // Volume analysis
            if (top.VolumeRatio > 1.5) volText = `量比${top.VolumeRatio.toFixed(1)}x，<strong>显著放量</strong>`;
            else if (top.VolumeRatio > 1.0) volText = `量比${top.VolumeRatio.toFixed(1)}x，<strong>温和放量</strong>`;
            else if (top.VolumeRatio > 0.7) volText = `量比${top.VolumeRatio.toFixed(1)}x，成交量正常`;
            else volText = `量比${top.VolumeRatio.toFixed(1)}x，<strong>明显缩量</strong>`;
            
            // Summary
            if (top.total_score >= 80) summary = '综合指标显示<strong>强烈买入信号</strong>';
            else if (top.total_score >= 60) summary = '综合指标偏向<strong>看多</strong>';
            else if (top.total_score >= 40) summary = '综合指标<strong>中性</strong>，建议观望';
            else summary = '综合指标<strong>偏空</strong>，暂不建议买入';
            
            container.innerHTML = `
                <h4 style="color: var(--accent-primary); margin-bottom: 15px;">为什么推荐 ${name}？</h4>
                <div style="display: grid; gap: 12px;">
                    <div style="padding: 12px; background: var(--bg-secondary); border-radius: 8px; border-left: 3px solid var(--accent-primary);">
                        📊 <strong>RSI分析:</strong> ${rsiText}
                    </div>
                    <div style="padding: 12px; background: var(--bg-secondary); border-radius: 8px; border-left: 3px solid var(--accent-secondary);">
                        📈 <strong>MACD分析:</strong> ${macdText}
                    </div>
                    <div style="padding: 12px; background: var(--bg-secondary); border-radius: 8px; border-left: 3px solid var(--accent-success);">
                        📉 <strong>趋势分析:</strong> ${trendText}
                    </div>
                    <div style="padding: 12px; background: var(--bg-secondary); border-radius: 8px; border-left: 3px solid var(--accent-warning);">
                        🚀 <strong>动量分析:</strong> ${momText}
                    </div>
                    <div style="padding: 12px; background: var(--bg-secondary); border-radius: 8px; border-left: 3px solid rgba(255, 136, 0, 0.8);">
                        📊 <strong>量能分析:</strong> ${volText}
                    </div>
                    <div style="padding: 15px; background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(123, 44, 191, 0.1)); border-radius: 8px; border: 1px solid var(--accent-primary); margin-top: 5px;">
                        💡 <strong>综合评价:</strong> ${summary}
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>

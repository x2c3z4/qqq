<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美股分析仪表盘</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-primary: #0f0f23;
            --bg-secondary: #1a1a2e;
            --bg-card: #16213e;
            --accent-primary: #00d4ff;
            --accent-secondary: #7b2cbf;
            --accent-success: #00ff88;
            --accent-warning: #ffd93d;
            --accent-danger: #ff6b6b;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --border-color: #2a2a4a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, var(--bg-secondary), var(--bg-card));
            border-bottom: 1px solid var(--border-color);
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 16px;
        }

        header h1 {
            font-size: 2rem;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        header p {
            color: var(--text-secondary);
            margin-top: 5px;
        }

        /* Recommendation Banner */
        .recommendation-banner {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(123, 44, 191, 0.1));
            border: 1px solid var(--accent-primary);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .recommendation-info h2 {
            font-size: 1.5rem;
            color: var(--accent-primary);
        }

        .recommendation-info .stock-symbol {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--text-primary);
            margin: 10px 0;
        }

        .recommendation-score {
            text-align: center;
        }

        .score-value {
            font-size: 4rem;
            font-weight: bold;
            background: linear-gradient(135deg, var(--accent-success), var(--accent-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .score-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Grid Layout */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .grid-full {
            grid-template-columns: 1fr;
        }

        /* Cards */
        .card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border-color);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .card-header h3 {
            font-size: 1.1rem;
            color: var(--text-primary);
        }

        .card-header .icon {
            font-size: 1.5rem;
        }

        /* Chart Container */
        .chart-container {
            position: relative;
            height: 300px;
        }

        /* Ranking Table */
        .ranking-table {
            width: 100%;
            border-collapse: collapse;
        }

        .ranking-table th,
        .ranking-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .ranking-table th {
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .ranking-table tr:hover {
            background: rgba(0, 212, 255, 0.05);
        }

        .ranking-table .rank {
            font-weight: bold;
            color: var(--accent-primary);
        }

        .ranking-table .rank-1 { color: #ffd700; }
        .ranking-table .rank-2 { color: #c0c0c0; }
        .ranking-table .rank-3 { color: #cd7f32; }

        .ranking-table .symbol {
            font-weight: 600;
        }

        .ranking-table .score {
            font-weight: bold;
        }

        .ranking-table .positive { color: var(--accent-success); }
        .ranking-table .negative { color: var(--accent-danger); }

        /* Indicator Pills */
        .indicator-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .pill {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 20px;
            padding: 8px 15px;
            font-size: 0.85rem;
        }

        .pill.success {
            background: rgba(0, 255, 136, 0.1);
            border-color: rgba(0, 255, 136, 0.3);
            color: var(--accent-success);
        }

        .pill.warning {
            background: rgba(255, 217, 61, 0.1);
            border-color: rgba(255, 217, 61, 0.3);
            color: var(--accent-warning);
        }

        .pill.danger {
            background: rgba(255, 107, 107, 0.1);
            border-color: rgba(255, 107, 107, 0.3);
            color: var(--accent-danger);
        }

        /* Reason Box */
        .reason-box {
            background: rgba(0, 212, 255, 0.05);
            border-left: 4px solid var(--accent-primary);
            padding: 20px;
            margin-top: 20px;
            border-radius: 0 12px 12px 0;
        }

        .reason-box h4 {
            color: var(--accent-primary);
            margin-bottom: 15px;
        }

        .reason-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 12px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
        }

        .reason-item .emoji {
            font-size: 1.3rem;
            margin-right: 12px;
        }

        .reason-item .text {
            color: var(--text-secondary);
        }

        .reason-item .text strong {
            color: var(--text-primary);
        }

        /* Signal List */
        .signal-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .signal-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .signal-item:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: translateX(5px);
        }

        .signal-item.buy {
            border-left: 3px solid var(--accent-success);
        }

        .signal-item.sell {
            border-left: 3px solid var(--accent-danger);
        }

        .signal-item .symbol {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-primary);
        }

        .signal-item .score {
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 6px

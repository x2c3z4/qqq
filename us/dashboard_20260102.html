<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美股分析仪表盘</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-primary: #0f0f23;
            --bg-secondary: #1a1a2e;
            --bg-card: #16213e;
            --accent-primary: #00d4ff;
            --accent-secondary: #7b2cbf;
            --accent-success: #00ff88;
            --accent-warning: #ffd93d;
            --accent-danger: #ff6b6b;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --border-color: #2a2a4a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, var(--bg-secondary), var(--bg-card));
            border-bottom: 1px solid var(--border-color);
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 16px;
        }

        header h1 {
            font-size: 2rem;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        header p {
            color: var(--text-secondary);
            margin-top: 5px;
        }

        /* Recommendation Banner */
        .recommendation-banner {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(123, 44, 191, 0.1));
            border: 1px solid var(--accent-primary);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .recommendation-info h2 {
            font-size: 1.5rem;
            color: var(--accent-primary);
        }

        .recommendation-info .stock-symbol {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--text-primary);
            margin: 10px 0;
        }

        .recommendation-score {
            text-align: center;
        }

        .score-value {
            font-size: 4rem;
            font-weight: bold;
            background: linear-gradient(135deg, var(--accent-success), var(--accent-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .score-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Grid Layout */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .grid-full {
            grid-template-columns: 1fr;
        }

        /* Cards */
        .card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border-color);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .card-header h3 {
            font-size: 1.1rem;
            color: var(--text-primary);
        }

        .card-header .icon {
            font-size: 1.5rem;
        }

        /* Chart Container */
        .chart-container {
            position: relative;
            height: 300px;
        }

        /* Ranking Table */
        .ranking-table {
            width: 100%;
            border-collapse: collapse;
        }

        .ranking-table th,
        .ranking-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .ranking-table th {
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .ranking-table tr:hover {
            background: rgba(0, 212, 255, 0.05);
        }

        .ranking-table .rank {
            font-weight: bold;
            color: var(--accent-primary);
        }

        .ranking-table .rank-1 { color: #ffd700; }
        .ranking-table .rank-2 { color: #c0c0c0; }
        .ranking-table .rank-3 { color: #cd7f32; }

        .ranking-table .symbol {
            font-weight: 600;
        }

        .ranking-table .score {
            font-weight: bold;
        }

        .ranking-table .positive { color: var(--accent-success); }
        .ranking-table .negative { color: var(--accent-danger); }

        /* Indicator Pills */
        .indicator-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .pill {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 20px;
            padding: 8px 15px;
            font-size: 0.85rem;
        }

        .pill.success {
            background: rgba(0, 255, 136, 0.1);
            border-color: rgba(0, 255, 136, 0.3);
            color: var(--accent-success);
        }

        .pill.warning {
            background: rgba(255, 217, 61, 0.1);
            border-color: rgba(255, 217, 61, 0.3);
            color: var(--accent-warning);
        }

        .pill.danger {
            background: rgba(255, 107, 107, 0.1);
            border-color: rgba(255, 107, 107, 0.3);
            color: var(--accent-danger);
        }

        /* Reason Box */
        .reason-box {
            background: rgba(0, 212, 255, 0.05);
            border-left: 4px solid var(--accent-primary);
            padding: 20px;
            margin-top: 20px;
            border-radius: 0 12px 12px 0;
        }

        .reason-box h4 {
            color: var(--accent-primary);
            margin-bottom: 15px;
        }

        .reason-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 12px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
        }

        .reason-item .emoji {
            font-size: 1.3rem;
            margin-right: 12px;
        }

        .reason-item .text {
            color: var(--text-secondary);
        }

        .reason-item .text strong {
            color: var(--text-primary);
        }

        /* Signal List */
        .signal-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .signal-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .signal-item:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: translateX(5px);
        }

        .signal-item.buy {
            border-left: 3px solid var(--accent-success);
        }

        .signal-item.sell {
            border-left: 3px solid var(--accent-danger);
        }

        .signal-item .symbol {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-primary);
        }

        .signal-item .score {
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .signal-item.buy .score {
            background: rgba(0, 255, 136, 0.15);
            color: var(--accent-success);
        }

        .signal-item.sell .score {
            background: rgba(255, 107, 107, 0.15);
            color: var(--accent-danger);
        }

        .signal-item .reason {
            color: var(--text-secondary);
            font-size: 0.85rem;
            flex: 1;
            margin: 0 15px;
        }

        .no-signal {
            color: var(--text-secondary);
            text-align: center;
            padding: 20px;
            font-style: italic;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
            
            .recommendation-banner {
                flex-direction: column;
                text-align: center;
            }
            
            .chart-container {
                height: 250px;
            }
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 50px;
            color: var(--text-secondary);
        }

        .loading::after {
            content: '';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
    </style>
</head>

                </div>

        <!-- Signals Summary -->
        <div class="grid" style="margin-bottom: 30px;">
            <div class="card" style="border-left: 4px solid var(--accent-success);">

                    <h3>⚡️ 今日买入信号</h3>
                    <span class="icon">📈</span>

                </div>
            </div>
            <div class="card" style="border-left: 4px solid var(--accent-danger);">
                <div class="card-header">
                    <h3>⚠️ 今日卖出信号</h3>
                    <span class="icon">📉</span>
                </div>
                <div id="sell-candidates" class="signal-list">
                    <div class="loading">加载中</div>
                </div>
            </div>
        </div>

        <!-- Charts Grid -->
        <div class="grid">
            <!-- Score Comparison -->
            <div class="card">
                <div class="card-header">
                    <h3>综合得分对比</h3>
                    <span class="icon">📊</span>
                </div>
                <div class="chart-container">
                    <canvas id="scoreChart"></canvas>
                </div>
            </div>

            <!-- Score Breakdown -->
            <div class="card">
                <div class="card-header">
                    <h3>推荐股票得分构成</h3>
                    <span class="icon">🎯</span>
                </div>
                <div class="chart-container">
                    <canvas id="breakdownChart"></canvas>
                </div>
            </div>

            <!-- RSI Comparison -->
            <div class="card">
                <div class="card-header">
                    <h3>RSI 指标对比</h3>
                    <span class="icon">📈</span>
                </div>
                <div class="chart-container">
                    <canvas id="rsiChart"></canvas>
                </div>
            </div>

            <!-- Momentum Comparison -->
            <div class="card">
                <div class="card-header">
                    <h3>10日动量对比</h3>
                    <span class="icon">🚀</span>
                </div>
                <div class="chart-container">
                    <canvas id="momentumChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Ranking Table -->
        <div class="card">
            <div class="card-header">
                <h3>股票排名详情</h3>
                <span class="icon">🏆</span>
            </div>
            <table class="ranking-table">
                <thead>
                    <tr>
                        <th>排名</th>
                        <th>股票</th>
                        <th>价格</th>
                        <th>涨跌幅</th>
                        <th>RSI</th>
                        <th>MACD</th>
                        <th>趋势</th>
                        <th>动量</th>
                        <th>量比</th>
                        <th>得分</th>
                    </tr>
                </thead>
                <tbody id="ranking-tbody">
                    <tr><td colspan="10" class="loading">加载中</td></tr>
                </tbody>
            </table>
        </div>

        <!-- Recommendation Reason -->
        <div class="card" style="margin-top: 20px;">
            <div class="card-header">
                <h3>推荐理由详解</h3>
                <span class="icon">💡</span>
            </div>
            <div class="reason-box" id="reason-box">
                <h4 id="reason-title">加载中...</h4>
                <div id="reason-content"></div>
            </div>
        </div>
    </div>

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {

        function updateDashboard(data) {
            // Update time
            document.getElementById('update-time').textContent = 
                '数据更新时间: ' + new Date().toLocaleString('zh-CN');

            // Top recommendation (Prioritize first BUY candidate, otherwise top score)
            const topBuy = data.find(d => d.signal === 'BUY');
            const top = topBuy || data[0];
            
            document.getElementById('top-symbol').textContent = top.name || top.symbol;
            document.getElementById('top-score').textContent = top.total_score.toFixed(1);

            // Indicators
            const indicators = document.getElementById('top-indicators');
            indicators.innerHTML = '';
            
            // RSI pill
            let rsiClass = 'pill';
            if (top.RSI < 30) rsiClass += ' success';
            else if (top.RSI > 70) rsiClass += ' danger';
            indicators.innerHTML += `<span class="${rsiClass}">RSI: ${top.RSI.toFixed(1)}</span>`;
            
            // MACD pill
            let macdClass = top.MACD > 0 ? 'pill success' : 'pill danger';
            indicators.innerHTML += `<span class="${macdClass}">MACD: ${top.MACD > 0 ? '金叉' : '死叉'}</span>`;
            
            // Trend pill
            let trendClass = top.Trend_score >= 75 ? 'pill success' : (top.Trend_score <= 25 ? 'pill danger' : 'pill warning');
            indicators.innerHTML += `<span class="${trendClass}">趋势: ${top.Trend_score.toFixed(0)}分</span>`;
            
            // Momentum pill
            let momClass = top.MomentumRate > 0 ? 'pill success' : 'pill danger';
            let momStr = top.MomentumRate >= 0 ? '+' + top.MomentumRate.toFixed(1) + '%' : top.MomentumRate.toFixed(1) + '%';
            indicators.innerHTML += `<span class="${momClass}">动量: ${momStr}</span>`;
            
            // Volume pill
            let volClass = 'pill';
            let volStr = '';
            if (top.VolumeRatio > 1.5) {
                volClass = 'pill success';
                volStr = '放量 (' + top.VolumeRatio.toFixed(1) + 'x)';
            } else if (top.VolumeRatio < 0.7) {
                volClass = 'pill warning';
                volStr = '缩量 (' + top.VolumeRatio.toFixed(1) + 'x)';
            } else {
                volStr = '量比 ' + top.VolumeRatio.toFixed(1) + 'x';
            }
            indicators.innerHTML += `<span class="${volClass}">${volStr}</span>`;

            // Render charts
            renderScoreChart(data);
            renderBreakdownChart(top);

            // Render ranking table

        function renderSignals(data) {
            const buyContainer = document.getElementById('buy-candidates');
            const sellContainer = document.getElementById('sell-candidates');
            
            const buyCandidates = data.filter(d => d.signal === 'BUY');
            const sellCandidates = data.filter(d => d.signal === 'SELL');
            
            // 建议仓位比例 (按排名分配)
            const positionPcts = [30, 25, 20, 15, 10];
            
            // Render buy candidates with position percentage
            if (buyCandidates.length > 0) {
                buyContainer.innerHTML = buyCandidates.slice(0, 5).map((stock, i) => {
                    const pct = positionPcts[i] || 10;
                    return `
                    <div class="signal-item buy">
                        <span class="symbol">${stock.name || stock.symbol}</span>
                        <span class="reason">${stock.signal_reason || ''}</span>
                        <span style="background: rgba(0,212,255,0.2); color: #00d4ff; padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; margin-right: 8px;">建议${pct}%</span>
                        <span class="score">${stock.total_score.toFixed(1)}分</span>
                    </div>`;
                }).join('');
            } else {
                buyContainer.innerHTML = '<div class="no-signal">无明确买入信号</div>';
            }
            
            // Render sell candidates
            if (sellCandidates.length > 0) {
                sellContainer.innerHTML = sellCandidates.slice(0, 5).map(stock => `
                    <div class="signal-item sell">
                        <span class="symbol">${stock.name || stock.symbol}</span>
                        <span class="reason">${stock.signal_reason || ''}</span>
                        <span class="score">${stock.total_score.toFixed(1)}分</span>
                    </div>
                `).join('');
            } else {
                sellContainer.innerHTML = '<div class="no-signal">无明确卖出信号</div>';
            }
        }

        function renderRankingTable(data) {
            const tbody = document.getElementById('ranking-tbody');
            tbody.innerHTML = data.map((d, i) => {
                const rankClass = i < 3 ? `rank-${i + 1}` : '';
                const changeClass = d.daily_change >= 0 ? 'positive' : 'negative';
                const changeStr = d.daily_change >= 0 ? '+' + d.daily_change.toFixed(2) + '%' : d.daily_change.toFixed(2) + '%';
                const macdStr = d.MACD > 0 ? '金叉' : '死叉';
                const momStr = d.MomentumRate >= 0 ? '+' + d.MomentumRate.toFixed(1) + '%' : d.MomentumRate.toFixed(1) + '%';
                
                // Volume ratio with color
                let volClass = '';
                let volStr = d.VolumeRatio.toFixed(1) + 'x';
                if (d.VolumeRatio > 1.5) {
                    volClass = 'positive';
                    volStr = '放量 ' + volStr;
                } else if (d.VolumeRatio < 0.7) {
                    volClass = 'negative';
                    volStr = '缩量 ' + volStr;
                }
                
                return `
                    <tr>
                        <td class="rank ${rankClass}">#${i + 1}</td>
                        <td class="symbol">${d.name || d.symbol}</td>
                        <td>$${d.close.toFixed(2)}</td>
                        <td class="${changeClass}">${changeStr}</td>
                        <td>${d.RSI.toFixed(1)}</td>
                        <td>${macdStr}</td>
                        <td>${d.Trend_score.toFixed(0)}</td>

        function renderReasons(top) {
            document.getElementById('reason-title').textContent = `为什么推荐 ${top.name || top.symbol}？`;
            
            const reasons = [];
            
            // RSI
            let rsiReason = '';
            if (top.RSI < 30) {
                rsiReason = `RSI=${top.RSI.toFixed(1)} 处于<strong>超卖区(&lt;30)</strong>，股价可能被低估，是较好的买入时机`;
            } else if (top.RSI < 50) {
                rsiReason = `RSI=${top.RSI.toFixed(1)} 处于<strong>偏低区(30-50)</strong>，存在上涨空间`;
            } else if (top.RSI < 70) {
                rsiReason = `RSI=${top.RSI.toFixed(1)} 处于<strong>正常区间(50-70)</strong>，趋势健康`;

                : `DIF<DEA 形成<strong>死叉</strong>，卖出信号；MACD柱=${top.MACD.toFixed(2)}<0，<strong>空头占优</strong>`;
            reasons.push({ emoji: '📊', text: `<strong>MACD分析:</strong> ${macdReason}` });
            
            // Trend
            let trendReason = '';
            if (top.Trend_score >= 100) {
                trendReason = '<strong>完美多头排列</strong>(价格>MA5>MA10>MA20)，强势上涨趋势';

                trendReason = '价格站上短中期均线，<strong>趋势向好</strong>';
            } else if (top.Trend_score <= 25) {
                trendReason = '<strong>空头排列</strong>，下跌趋势';

                trendReason = '均线交织，趋势不明朗';
            }
            reasons.push({ emoji: '📉', text: `<strong>趋势分析:</strong> ${trendReason}` });

                momReason = `10日动量+${top.MomentumRate.toFixed(1)}%，<strong>强劲上涨动能</strong>`;

                momReason = `10日动量+${top.MomentumRate.toFixed(1)}%，<strong>温和上涨</strong>`;

            reasons.push({ emoji: '🚀', text: `<strong>动量分析:</strong> ${momReason}` });
            
            // Volume

            if (top.VolumeRatio > 2.0) {

        function renderPortfolio(data) {
            const container = document.getElementById('portfolio-card');
            const listContainer = document.getElementById('portfolio-list');
            
            // 1. 筛选逻辑: BUY + 优质 HOLD (Score>=65 && Trend>=60)
            let portfolio = data.filter(d => 
                d.signal === 'BUY' || 
                (d.signal === 'HOLD' && d.total_score >= 65 && d.Trend_score >= 60)
            );
            
            if (portfolio.length === 0) {
                container.style.display = 'none';
                return;
            }
            
            container.style.display = 'block';
            
            // 2. 权重计算
            let totalWeightScore = 0;
            portfolio = portfolio.map(d => {
                let weightScore = d.total_score;
                if (d.signal === 'BUY') weightScore *= 1.2; // 给予 BUY 信号 20% 的权重奖励
                totalWeightScore += weightScore;
                return { ...d, weightScore };
            });
            
            // 归一化并排序
            portfolio.forEach(d => {
                d.weight = (d.weightScore / totalWeightScore) * 100;
            });
            portfolio.sort((a, b) => b.weight - a.weight);
            
            // 3. 渲染列表
            const colors = ['#00d4ff', '#7b2cbf', '#00ff88', '#ffd93d', '#ff6b6b', '#ff9f43', '#54a0ff'];
            listContainer.innerHTML = portfolio.map((stock, i) => {
                const color = colors[i % colors.length];
                const typeLabel = stock.signal === 'BUY' ? '🟢 信号买入' : '⚪️ 强势持有';
                return `
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <div style="width: 50px; font-weight: bold; color: ${color};">${(stock.weight).toFixed(1)}%</div>
                        <div style="flex: 1;">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
                                <span style="font-weight: 600;">${stock.name || stock.symbol}</span>
                                <span style="font-size: 0.8rem; color: var(--text-secondary);">${typeLabel}</span>
                            </div>
                            <div style="height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden;">
                                <div style="height: 100%; width: ${stock.weight}%; background: ${color};"></div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            
            // 4. 渲染图表
            const ctx = document.getElementById('portfolioChart').getContext('2d');
            if (window.portfolioChartInstance) window.portfolioChartInstance.destroy();
            
            window.portfolioChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: portfolio.map(d => d.name || d.symbol),
                    datasets: [{
                        data: portfolio.map(d => d.weight),
                        backgroundColor: portfolio.map((_, i) => colors[i % colors.length]),
                        borderWidth: 0,
                        hoverOffset: 10
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '65%',
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.label + ': ' + context.parsed.toFixed(1) + '%';
                                }
                            }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>

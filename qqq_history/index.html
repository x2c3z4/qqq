<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QQQ 历史回测</title>
    <style>
        :root {
            --bg-primary: #0f0f23;
            --bg-card: #1a1a2e;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --accent-primary: #00d4ff;
            --border-color: rgba(255,255,255,0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 30px;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(123, 44, 191, 0.1));
            border-radius: 16px;
        }
        header h1 { font-size: 2rem; margin-bottom: 10px; }
        .backtest-notice {
            background: rgba(255, 217, 61, 0.15);
            border: 1px solid #ffd93d;
            border-radius: 8px;
            padding: 12px 20px;
            margin: 20px 0;
            font-size: 0.9rem;
        }
        .year-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }
        .year-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 25px;
            text-decoration: none;
            color: inherit;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
            text-align: center;
        }
        .year-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-primary);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.2);
        }
        .year-title { font-size: 1.8rem; font-weight: bold; margin-bottom: 10px; color: var(--accent-primary); }
        .year-return { font-size: 2rem; font-weight: bold; margin-bottom: 15px; }
        .year-stats { font-size: 0.9rem; margin-bottom: 8px; display: flex; justify-content: center; gap: 12px; }
        .year-signals { font-size: 0.8rem; margin-bottom: 10px; display: flex; justify-content: center; gap: 8px; }
        .signal-tag { padding: 3px 8px; border-radius: 4px; font-weight: 500; }
        .signal-tag.buy { background: rgba(0, 255, 136, 0.2); color: #00ff88; }
        .signal-tag.sell { background: rgba(255, 107, 107, 0.2); color: #ff6b6b; }
        .signal-tag.hold { background: rgba(255, 217, 61, 0.2); color: #ffd93d; }
        .year-days { font-size: 0.85rem; color: var(--text-secondary); }
        footer { text-align: center; margin-top: 30px; color: var(--text-secondary); font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 QQQ 历史回测分析</h1>
            <p>选择年份查看详细分析</p>
        </header>
        
        <div class="backtest-notice">
            ⚠️ <strong>历史回测说明:</strong> 模拟"如果当时运行分析系统"的结果，用于验证系统表现。
        </div>
        
        <div class="year-grid">
            
        <a href="2026/index.html" class="year-card">
            <div class="year-title">2026年</div>
            <div class="year-return" style="color: #00ff88">+3.9%</div>
            <div class="year-stats">
                <span style="color: #ff6b6b">📉 49</span>
                <span style="color: #00ff88">📈 57</span>
                <span style="color: #ffd93d">⏸️ 0</span>
            </div>
            <div class="year-signals">
                <span class="signal-tag buy">Buy 19</span>
                <span class="signal-tag sell">Sell 43</span>
                <span class="signal-tag hold">Hold 44</span>
            </div>
            <div class="year-days">106 交易日</div>
        </a>

        <a href="2025/index.html" class="year-card">
            <div class="year-title">2025年</div>
            <div class="year-return" style="color: #00ff88">+20.8%</div>
            <div class="year-stats">
                <span style="color: #ff6b6b">📉 158</span>
                <span style="color: #00ff88">📈 207</span>
                <span style="color: #ffd93d">⏸️ 0</span>
            </div>
            <div class="year-signals">
                <span class="signal-tag buy">Buy 57</span>
                <span class="signal-tag sell">Sell 102</span>
                <span class="signal-tag hold">Hold 206</span>
            </div>
            <div class="year-days">365 交易日</div>
        </a>

        </div>
        
        <footer>
            <p>⚠️ 本分析仅供参考，不构成投资建议</p>
            <p>生成时间: 2026-04-16 21:01:22</p>
        </footer>
    </div>
</body>
</html>

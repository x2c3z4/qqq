<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QQQ 分析 - 2026-05-22</title>
    <style>
        :root {
            --bg-primary: #0f0f23;
            --bg-card: #1a1a2e;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --accent-primary: #00d4ff;
            --border-color: rgba(255,255,255,0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        header {
            text-align: center;
            margin-bottom: 25px;
            padding: 20px;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(123, 44, 191, 0.1));
            border-radius: 12px;
        }
        header h1 { font-size: 1.8rem; margin-bottom: 8px; }
        .backtest-notice {
            background: rgba(255, 217, 61, 0.15);
            border: 1px solid #ffd93d;
            border-radius: 8px;
            padding: 8px 15px;
            display: inline-block;
            margin-top: 8px;
            font-size: 0.85rem;
        }
        .signal-banner {
            background: linear-gradient(135deg, #ffd93d22, #ffd93d11);
            border: 2px solid #ffd93d;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            text-align: center;
        }
        .signal-banner h2 { font-size: 2rem; color: #ffd93d; margin-bottom: 8px; }
        .signal-banner .price { font-size: 1.3rem; margin-bottom: 8px; }
        .signal-banner .reason { color: var(--text-secondary); font-size: 0.9rem; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            border: 1px solid var(--border-color);
        }
        .stat-card .value { font-size: 1.5rem; font-weight: bold; }
        .stat-card .label { font-size: 0.8rem; color: var(--text-secondary); margin-top: 5px; }
        .nav-links {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 25px;
        }
        .nav-links a {
            background: var(--bg-card);
            color: var(--accent-primary);
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            font-size: 0.85rem;
        }
        .nav-links a:hover { background: rgba(0, 212, 255, 0.1); border-color: var(--accent-primary); }
        .nav-links a.current { background: var(--accent-primary); color: var(--bg-primary); }
        footer { text-align: center; margin-top: 30px; color: var(--text-secondary); font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 QQQ 历史分析</h1>
            <p>2026-05-22</p>
            <div class="backtest-notice">⚠️ 历史回测</div>
        </header>
        
        <div class="signal-banner">
            <h2>⏸️ 持有观望</h2>
            <div class="price">
                $716.75
                <span style="color: #00ff88">
                    (+0.42%)
                </span>
            </div>
            <div class="reason">指标偏弱</div>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="value" style="color: #ff9f43">41</div>
                <div class="label">综合评分</div>
            </div>
            <div class="stat-card">
                <div class="value">73.5</div>
                <div class="label">RSI</div>
            </div>
            <div class="stat-card">
                <div class="value">-2.711</div>
                <div class="label">MACD</div>
            </div>
            <div class="stat-card">
                <div class="value">+0.9%</div>
                <div class="label">动量</div>
            </div>
        </div>
        
        <div class="nav-links">
            <a href="index.html">📋 索引</a>
            <a href="index_05.html">5月</a>
        </div>
        
        <footer>
            <p>⚠️ 仅供参考，不构成投资建议</p>
        </footer>
    </div>
</body>
</html>
